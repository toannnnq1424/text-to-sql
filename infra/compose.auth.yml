name: nla-auth

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${NLA_IDP_ADMIN_USERNAME:?Run infra/local/oidc.py init}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${NLA_IDP_ADMIN_PASSWORD:?Run infra/local/oidc.py init}
      KC_HOSTNAME: http://127.0.0.1:8180
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: warn
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ../.local/oidc/import:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000
          printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3
          head -n 1 <&3 | grep -q '200'
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

volumes:
  keycloak_data:
