# Overlay infra/compose.databases.yml; private env files are generated by local/compose.py.
services:
  backend:
    image: nla/backend:local
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - path: ../.local/compose-app/backend.env
        format: raw
    ports:
      - "127.0.0.1:${NLA_COMPOSE_API_PORT:-8085}:8080"
    volumes:
      - ../.local/compose-app/mysql-public-key.pem:/run/nla/mysql-public-key.pem:ro
    networks:
      - default
      - app-private
      - web
      - auth
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
      python-ai:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        [
          "CMD",
          "java",
          "-cp",
          "/app/health",
          "HttpHealth",
          "http://127.0.0.1:8080/api/v1/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  python-ai:
    image: nla/python-ai:local
    build:
      context: ..
      dockerfile: ai-service/Dockerfile
    env_file:
      - path: ../.local/compose-app/ai.env
        format: raw
    networks:
      - app-private
      - ai-egress
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "/app/ai-health.py"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  frontend:
    image: nla/frontend:local
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        OIDC_AUTHORITY: ${OIDC_ISSUER_URI:-http://127.0.0.1:8180/realms/nla}
        OIDC_CLIENT_ID: nla-web
        OIDC_ALLOW_HTTP_LOOPBACK: "true"
    ports:
      - "127.0.0.1:${NLA_COMPOSE_WEB_PORT:-4173}:8080"
    networks:
      - web
      - ingress
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 15

networks:
  app-private:
    internal: true
  web:
    internal: true
  ai-egress:
  ingress:
  auth:
    external: true
    name: nla-auth_default
