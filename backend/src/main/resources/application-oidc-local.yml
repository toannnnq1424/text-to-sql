# Real OIDC authentication against a loopback development IdP.
# Warehouse TLS is disabled only for the isolated local Docker databases.
nla:
  local: false
  warehouse-tls: false
server:
  address: 127.0.0.1
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
          audiences: ${OIDC_AUDIENCE}
